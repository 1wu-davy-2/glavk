# glavk docker compose（SQLite 版本）
# 数据库就是容器里的一个文件：/app/data/glavk.sqlite3，落在 backend_data 卷上。
# 重建镜像（docker compose up -d --build）不会动这个卷，数据不会丢；
# 会丢数据的是 docker compose down -v 和 docker volume rm，见 README「数据持久化」一节。
# 如需改回外部 MySQL/MariaDB，在 .env 里把 DATABASE_URL 设成
# mysql+pymysql://user:password@host:3306/glavk?charset=utf8mb4 即可，其余不用改。

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      # SQLite 数据文件必须留在 /app/data（即 backend_data 卷）里，
      # 改成卷外的路径，容器一重建数据就没了。
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/glavk.sqlite3}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-before-start}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRANSPORT_PRIVATE_KEY_B64: ${TRANSPORT_PRIVATE_KEY_B64:-}
      SCREENSHOT_DIR: ${SCREENSHOT_DIR:-/app/data/screenshots}
      SCREENSHOT_ALLOW_PRIVATE_NETWORKS: ${SCREENSHOT_ALLOW_PRIVATE_NETWORKS:-false}
      # 纯 HTTP 访问时浏览器不提供 WebCrypto，登录将无法加密凭据。
      # 自用 HTTP 环境设为 true；有 HTTPS 的部署保持 false。
      ALLOW_PLAINTEXT_CREDENTIALS: ${ALLOW_PLAINTEXT_CREDENTIALS:-false}
      GLAVK_RUNTIME_SECRETS_FILE: ${GLAVK_RUNTIME_SECRETS_FILE:-/app/data/runtime-secrets.env}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-6555}:8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-6222}:80"

volumes:
  backend_data:
