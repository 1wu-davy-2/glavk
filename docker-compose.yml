# glavk docker compose
# 数据库默认外接：在项目根 .env 中填写 DB_HOST / DB_PORT / DB_USER / DB_PASSWORD 指向你的 MariaDB。
# 如需改用 Compose 内置 MariaDB，见下方 mariadb 服务的 profiles 说明。

services:
  # 可选：内置 MariaDB（默认不启动）。
  # 启用：docker compose --profile bundled-db up -d --build
  # 启用后 .env 中数据库四要素填：DB_HOST=mariadb、DB_PORT=3306、DB_USER=glavk_user、
  # DB_PASSWORD 与下方 MARIADB_PASSWORD 保持一致。
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    profiles: ["bundled-db"]
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-glavk}
      MARIADB_USER: ${MARIADB_USER:-glavk_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change-me-db-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root-password}
    ports:
      - "${MARIADB_BIND_ADDRESS:-127.0.0.1}:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      # 数据库四要素在 .env 中配置：DB_HOST / DB_PORT / DB_USER / DB_PASSWORD，库名固定为 glavk。
      # 由后端自行拼接连接串并做 URL 编码，密码中可以包含 @ : / ? # 等任意字符。
      DB_HOST: ${DB_HOST:?请在项目根 .env 中设置 DB_HOST（数据库主机IP）}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?请在项目根 .env 中设置 DB_USER（数据库用户名）}
      DB_PASSWORD: ${DB_PASSWORD:?请在项目根 .env 中设置 DB_PASSWORD（数据库密码）}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-before-start}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRANSPORT_PRIVATE_KEY_B64: ${TRANSPORT_PRIVATE_KEY_B64:-}
      SCREENSHOT_DIR: ${SCREENSHOT_DIR:-/app/data/screenshots}
      SCREENSHOT_ALLOW_PRIVATE_NETWORKS: ${SCREENSHOT_ALLOW_PRIVATE_NETWORKS:-false}
      GLAVK_RUNTIME_SECRETS_FILE: ${GLAVK_RUNTIME_SECRETS_FILE:-/app/data/runtime-secrets.env}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-6555}:8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-6222}:80"

volumes:
  mariadb_data:
  backend_data:
